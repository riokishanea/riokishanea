<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Riokishan EA. CS student and freelance web developer building with Next.js, TypeScript and Tailwind CSS."><title>Riokishan EA. CS student and freelance web developer building with Next.js, TypeScript and Tailwind CSS.</title><defs><style>@font-face{font-family:'RioSans';font-weight:800;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'RioMono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'RioSans';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
.f-disp{font-family:'RioSans',Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-weight:800}
.f-mono{font-family:'RioMono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:400}
.f-sans{font-family:'RioSans',Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-weight:400}
.a{animation-duration:.8s;animation-timing-function:cubic-bezier(.22,.8,.24,1);animation-fill-mode:both;transform-box:fill-box}
.rise{animation-name:rise}.fade{animation-name:fade}
.pop{animation-name:pop;transform-origin:50% 50%}
.grow{animation-name:grow;transform-origin:50% 100%}
.sweep{animation-name:sweep;transform-origin:0 50%}
.draw{animation-name:draw;stroke-dasharray:1;animation-duration:1.1s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{0%{stroke-dashoffset:1;opacity:0}6%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.live{display:none}}
</style><radialGradient id="glow"><stop offset="0" stop-color="#8b7cff" stop-opacity=".42"/><stop offset="1" stop-color="#8b7cff" stop-opacity="0"/></radialGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#2a2745"/></pattern><clipPath id="r"><rect width="880" height="300" rx="18"/></clipPath></defs><rect x=".5" y=".5" width="879" height="299" rx="18" fill="#0e0c1a" stroke="#2a2745"/><g clip-path="url(#r)"><rect width="880" height="300" fill="url(#dots)" opacity=".6"/><circle cx="740" cy="40" r="300" fill="url(#glow)"/><circle cx="0" cy="320" r="230" fill="url(#glow)" opacity=".5"/></g><g class="a rise" style="animation-delay:0.10s"><text x="48.0" y="104.0" class="f-mono" font-size="16" fill="#8b7cff">hi, I'm</text></g><g class="a rise" style="animation-delay:0.25s"><text x="48.0" y="180.0" class="f-disp" font-size="80" fill="#f0effb" letter-spacing="-1.5">Riokishan EA</text></g><g class="live"><rect x="556.6" y="122.4" width="6" height="57.6" rx="1.5" fill="#8b7cff" opacity="0"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="1.2s" begin="1s" repeatCount="indefinite"/></rect></g><g class="a sweep" style="animation-delay:0.45s"><rect x="48" y="196" width="64" height="4" rx="2" fill="#8b7cff"/></g><g class="a rise" style="animation-delay:0.60s"><text x="48.0" y="238.0" class="f-sans" font-size="20" fill="#a3a0ba">CS student and freelance web developer building with Next.js, TypeScript</text></g><g class="a rise" style="animation-delay:0.72s"><text x="48.0" y="266.0" class="f-sans" font-size="20" fill="#a3a0ba">and Tailwind CSS.</text></g></svg>
