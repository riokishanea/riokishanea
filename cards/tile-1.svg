<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="132" viewBox="0 0 300 132" role="img" aria-label="LinkedIn: Let's connect"><title>LinkedIn: Let's connect</title><defs><style>@font-face{font-family:'RioMono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'RioSans';font-weight:700;font-style:normal;src:url(data:font/woff;base64,) format('woff')}
.f-mono{font-family:'RioMono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:400}
.f-sansb{font-family:'RioSans',Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-weight:700}
.a{animation-duration:.8s;animation-timing-function:cubic-bezier(.22,.8,.24,1);animation-fill-mode:both;transform-box:fill-box}
.rise{animation-name:rise}.fade{animation-name:fade}
